name: "Andromeda DriftFix TIPA v2.5.10"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build App（免签，纯 Apple SDK）
        run: |
          xcodebuild -project Geranium.xcodeproj -scheme Geranium \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Assemble TIPA（免签 + ldid entitlements + 官方 2.5.2 RootHelper 二进制）
        run: |
          APP_SRC="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app"
          test -d "$APP_SRC"
          cp -R "$APP_SRC" build/Geranium.app
          codesign --remove build/Geranium.app || true
          rm -rf build/Geranium.app/_CodeSignature build/Geranium.app/embedded.mobileprovision
          # RootHelper 预编译二进制（取自官方 Son3ra1n/Andromeda v2.5.2 发布包，GPL-3.0；
          # 本项目改动全在 App 侧 Swift，helper 无改动原样复用）
          cp RootHelper/prebuilt/GeraniumRootHelper build/Geranium.app/GeraniumRootHelper
          ldid -Sentitlements.plist build/Geranium.app/Geranium
          ldid -S"Bookmark Location in Geranium/entitlements.plist" \
            "build/Geranium.app/PlugIns/Bookmark Location in Geranium.appex/Bookmark Location in Geranium"
          cd build
          rm -rf Payload
          mkdir Payload
          cp -R Geranium.app Payload/Geranium.app
          zip -qry Geranium.tipa Payload
          cd ..
          cp build/Geranium.tipa "Geranium-2.5.10-midfill.tipa"
          shasum -a 256 "Geranium-2.5.10-midfill.tipa" | tee sha256.txt
          ls -la "Geranium-2.5.10-midfill.tipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-DriftFix-TIPA
          path: |
            Geranium-2.5.10-midfill.tipa
            sha256.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.10-midfill
          name: "Andromeda 2.5.10（中间补点 + 长段自然化 + 距离优先）"
          body: |
            基于上游 Son3ra1n/Andromeda 2.5.2（GPL-3.0）。
            1. 新增「中间补点」，按 50~500 米自动插入途经点。
            2. 长段不再是一根直线，每 110 米一个自然弯节点。
            3. 绕行超过 18% 的导航路线自动放弃，改走短路线。
            4. 速度区显示每秒采点密度，可核对轨迹是否自然。
            5. 保存线路点击后恢复起点、终点和途经点。
            6. 出行方式与速度区间记住上次选择，不再跳回开车。
            7. 随机路线按顺序就近串联，不再交叉折返。
            RootHelper 使用官方 2.5.2 发布包二进制（无改动）。
          files: |
            Geranium-2.5.10-midfill.tipa
            sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
