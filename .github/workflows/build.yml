name: "Andromeda DriftFix TIPA v2.5.5"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build App（免签，纯 Apple SDK）
        run: |
          xcodebuild -project Geranium.xcodeproj -scheme Geranium \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Assemble TIPA（免签 + ldid entitlements + 官方 2.5.2 RootHelper 二进制）
        run: |
          APP_SRC="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app"
          test -d "$APP_SRC"
          cp -R "$APP_SRC" build/Geranium.app
          codesign --remove build/Geranium.app || true
          rm -rf build/Geranium.app/_CodeSignature build/Geranium.app/embedded.mobileprovision
          # RootHelper 预编译二进制（取自官方 Son3ra1n/Andromeda v2.5.2 发布包，GPL-3.0；
          # 本项目改动全在 App 侧 Swift，helper 无改动原样复用）
          cp RootHelper/prebuilt/GeraniumRootHelper build/Geranium.app/GeraniumRootHelper
          ldid -Sentitlements.plist build/Geranium.app/Geranium
          ldid -S"Bookmark Location in Geranium/entitlements.plist" \
            "build/Geranium.app/PlugIns/Bookmark Location in Geranium.appex/Bookmark Location in Geranium"
          cd build
          rm -rf Payload
          mkdir Payload
          cp -R Geranium.app Payload/Geranium.app
          zip -qry Geranium.tipa Payload
          cd ..
          cp build/Geranium.tipa "Geranium-2.5.5-route-manage.tipa"
          shasum -a 256 "Geranium-2.5.5-route-manage.tipa" | tee sha256.txt
          ls -la "Geranium-2.5.5-route-manage.tipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Andromeda-DriftFix-TIPA
          path: |
            Geranium-2.5.5-route-manage.tipa
            sha256.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.5-route-manage
          name: "Andromeda 2.5.5（自由路线 + 途径点 + 线路管理：重命名/删除/排序/分享）"
          body: |
            基于上游 Son3ra1n/Andromeda 2.5.2（GPL-3.0）。
            1. LocSimManager 单点注入后每 0.75s 保活重注入，压住 locationd 融合定位拉扯（单点漂移根治）；路线终点继续保活。
            2. MKRoute polyline 基准自动判定（中国大陆返回 WGS-84）：显示转 GCJ 贴回真实道路，注入免 GCJ→WGS 双重转换。
            3. 收藏/App预设 点击模拟不再二次转换（原实现存 WGS 当 GCJ 转 → 固定偏 ~500m）。
            4. 新增手动坐标输入（GCJ/WGS 可选基准），对齐 Geranium 能力。
            5. GPX 导入转 GCJ 后再进算路。
            RootHelper 使用官方 2.5.2 发布包二进制（无改动）。
          files: |
            Geranium-2.5.5-route-manage.tipa
            sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
