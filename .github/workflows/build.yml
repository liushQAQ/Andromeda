name: "自由轨迹 TIPA v2.6.0"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build App（免签，纯 Apple SDK）
        run: |
          xcodebuild -project Geranium.xcodeproj -scheme Geranium \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Verify Info.plist（应用名/版本防回退）
        run: |
          PLIST="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "name=$NAME ver=$VER build=$BLD"
          test "$NAME" = "自由轨迹" || { echo "构建产物应用名被构建设置覆盖，实际=$NAME"; exit 1; }
          test "$VER" = "2.6.0-freetrack" || { echo "版本号不符，实际=$VER"; exit 1; }
          test "$BLD" = "14" || { echo "构建号不符，实际=$BLD"; exit 1; }
          test -f "build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app/InjectorBin/LiushJoyRunSteps.dylib" \
            || { echo "注入插件没被打进 App（InjectorBin 缺失）"; exit 1; }
          test -f "build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app/InjectorBin/insert_dylib" \
            || { echo "注入工具没被打进 App（insert_dylib 缺失）"; exit 1; }

      - name: Assemble TIPA（免签 + ldid entitlements + RootHelper + 注入工具）
        run: |
          APP_SRC="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app"
          test -d "$APP_SRC"
          cp -R "$APP_SRC" build/Geranium.app
          codesign --remove build/Geranium.app || true
          rm -rf build/Geranium.app/_CodeSignature build/Geranium.app/embedded.mobileprovision
          # RootHelper 预编译二进制（取自官方 Son3ra1n/Andromeda v2.5.2 发布包，GPL-3.0；
          # 本项目改动全在 App 侧 Swift，helper 无改动原样复用）
          cp RootHelper/prebuilt/GeraniumRootHelper build/Geranium.app/GeraniumRootHelper
          ldid -Sentitlements.plist build/Geranium.app/Geranium
          ldid -S"Bookmark Location in Geranium/entitlements.plist" \
            "build/Geranium.app/PlugIns/Bookmark Location in Geranium.appex/Bookmark Location in Geranium"
          # 注入工具（ldid / insert_dylib）与插件本体：逐个假签 + 可执行位
          chmod -R 755 build/Geranium.app/InjectorBin
          for f in build/Geranium.app/InjectorBin/*; do
            ldid -S "$f" || { echo "签名失败: $f"; exit 1; }
          done
          ls -la build/Geranium.app/InjectorBin
          cd build
          rm -rf Payload
          mkdir Payload
          cp -R Geranium.app Payload/Geranium.app
          zip -qry Geranium.tipa Payload
          cd ..
          cp build/Geranium.tipa "Geranium-2.6.0-freetrack.tipa"
          shasum -a 256 "Geranium-2.6.0-freetrack.tipa" | tee sha256.txt
          ls -la "Geranium-2.6.0-freetrack.tipa"

      - name: Generate latest.json（云端更新检测元数据）
        run: |
          python3 - <<'PY'
          import io, json
          changelog = "\n".join([
              "1. 装 App 时插件一起装好，不用再单独装第二个。",
              "2. 设置页新增步数插件，一键注入悦跑圈或咕咚。",
              "3. 注入失败会自动还原，不会把 App 弄成打不开。",
              "4. 地图选途经点改成一次打开、长按连点、一次保存。",
              "5. 每个途经点都能单独删除，不用退出去重选。",
              "6. 往返和起点终点互换分成两个开关，说明写清楚。",
              "7. 手画线路新增修改线路，拖动或点删，不用整条重画。",
              "8. 手画线路会自动保存，关掉再进来能接着改。",
          ])
          data = {
              "version": "2.6.0-freetrack",
              "build": 14,
              "title": "自由轨迹 v2.6.0（插件合并 + 选点/手画大改）",
              "changelog": changelog,
              "tipa_url": "https://github.com/liushQAQ/Andromeda/releases/download/v2.6.0-freetrack/Geranium-2.6.0-freetrack.tipa",
              "min_ios": "15.0",
          }
          with io.open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(io.open("latest.json", encoding="utf-8").read())
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTrack-TIPA
          path: |
            Geranium-2.6.0-freetrack.tipa
            latest.json
            sha256.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-freetrack
          name: "自由轨迹 2.6.0（插件合并 + 选点/手画大改）"
          body: |
            基于上游 Son3ra1n/Andromeda 2.5.2（GPL-3.0）。
            1. 装 App 时插件一起装好，不用再单独装第二个。
            2. 设置页新增步数插件，一键注入悦跑圈或咕咚。
            3. 注入失败会自动还原，不会把 App 弄成打不开。
            4. 地图选途经点改成一次打开、长按连点、一次保存。
            5. 每个途经点都能单独删除，不用退出去重选。
            6. 往返和起点终点互换分成两个开关，说明写清楚。
            7. 手画线路新增修改线路，拖动或点删，不用整条重画。
            8. 手画线路会自动保存，关掉再进来能接着改。
            RootHelper 使用官方 2.5.2 发布包二进制（无改动）。
          files: |
            Geranium-2.6.0-freetrack.tipa
            latest.json
            sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
