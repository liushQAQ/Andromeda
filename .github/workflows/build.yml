name: "自由轨迹 TIPA v2.7.3"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build App（免签，纯 Apple SDK）
        run: |
          xcodebuild -project Geranium.xcodeproj -scheme Geranium \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Verify Info.plist（应用名/版本防回退）
        run: |
          PLIST="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "name=$NAME ver=$VER build=$BLD"
          test "$NAME" = "自由轨迹" || { echo "构建产物应用名被构建设置覆盖，实际=$NAME"; exit 1; }
          test "$VER" = "2.7.3-freetrack" || { echo "版本号不符，实际=$VER"; exit 1; }
          test "$BLD" = "18" || { echo "构建号不符，实际=$BLD"; exit 1; }

      - name: Assemble TIPA（免签 + ldid entitlements + RootHelper）
        run: |
          APP_SRC="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app"
          test -d "$APP_SRC"
          cp -R "$APP_SRC" build/Geranium.app
          codesign --remove build/Geranium.app || true
          rm -rf build/Geranium.app/_CodeSignature build/Geranium.app/embedded.mobileprovision
          # RootHelper 预编译二进制（取自官方 Son3ra1n/Andromeda v2.5.2 发布包，GPL-3.0；
          # 本项目改动全在 App 侧 Swift，helper 无改动原样复用）
          cp RootHelper/prebuilt/GeraniumRootHelper build/Geranium.app/GeraniumRootHelper
          ldid -Sentitlements.plist build/Geranium.app/Geranium
          ldid -S"Bookmark Location in Geranium/entitlements.plist" \
            "build/Geranium.app/PlugIns/Bookmark Location in Geranium.appex/Bookmark Location in Geranium"
          cd build
          rm -rf Payload
          mkdir Payload
          cp -R Geranium.app Payload/Geranium.app
          zip -qry Geranium.tipa Payload
          cd ..
          cp build/Geranium.tipa "Geranium-2.7.3-freetrack.tipa"
          shasum -a 256 "Geranium-2.7.3-freetrack.tipa" | tee sha256.txt
          ls -la "Geranium-2.7.3-freetrack.tipa"

      - name: Generate latest.json（云端更新检测元数据）
        run: |
          python3 - <<'PY'
          import io, json
          changelog = "\n".join([
              "1. 区域自动改成手画，想要什么形状就画什么形状。",
              "2. 跑起来只在画的范围内绕，不会再跑出边界。",
              "3. 画歪了直接再画一次就覆盖，不用先删旧的。",
              "4. 手画区域的面积和长宽会在面板上实时显示。",
              "5. 以前存的方框区域照样能用，自动变成方框形状。",
              "6. 起点、终点和目标公里数的用法完全没变。",
          ])
          data = {
              "version": "2.7.3-freetrack",
              "build": 18,
              "title": "自由轨迹 v2.7.3（手画区域）",
              "changelog": changelog,
              "tipa_url": "https://github.com/liushQAQ/Andromeda/releases/download/v2.7.3-freetrack/Geranium-2.7.3-freetrack.tipa",
              "tipa_mirrors": [
                  "https://ghfast.top/https://github.com/liushQAQ/Andromeda/releases/download/v2.7.3-freetrack/Geranium-2.7.3-freetrack.tipa",
                  "https://gh-proxy.com/https://github.com/liushQAQ/Andromeda/releases/download/v2.7.3-freetrack/Geranium-2.7.3-freetrack.tipa",
              ],
              "min_ios": "15.0",
          }
          with io.open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(io.open("latest.json", encoding="utf-8").read())
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTrack-TIPA
          path: |
            Geranium-2.7.3-freetrack.tipa
            latest.json
            sha256.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.3-freetrack
          name: "自由轨迹 2.7.3（手画区域）"
          body: |
            基于上游 Son3ra1n/Andromeda 2.5.2（GPL-3.0）。
            1. 区域自动改成手画，想要什么形状就画什么形状。
            2. 跑起来只在画的范围内绕，不会再跑出边界。
            3. 画歪了直接再画一次就覆盖，不用先删旧的。
            4. 手画区域的面积和长宽会在面板上实时显示。
            5. 以前存的方框区域照样能用，自动变成方框形状。
            6. 起点、终点和目标公里数的用法完全没变。
            7. 地图选途经点一次打开，长按连点，一次保存。
            8. 往返和起终点互换分成两个开关，说明写清楚。
            9. 手画线路能改，笔画自动保存，不用整条重画。
            步数插件仍单独安装，不与本 App 打包在一起。
            RootHelper 使用官方 2.5.2 发布包二进制（无改动）。
          files: |
            Geranium-2.7.3-freetrack.tipa
            latest.json
            sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
