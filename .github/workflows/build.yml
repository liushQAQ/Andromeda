name: "自由轨迹 TIPA v2.7.9"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build App（免签，纯 Apple SDK）
        run: |
          xcodebuild -project Geranium.xcodeproj -scheme Geranium \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      - name: Verify Info.plist（应用名/版本防回退）
        run: |
          PLIST="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app/Info.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BLD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "name=$NAME ver=$VER build=$BLD"
          test "$NAME" = "自由轨迹" || { echo "构建产物应用名被构建设置覆盖，实际=$NAME"; exit 1; }
          test "$VER" = "2.7.9-freetrack" || { echo "版本号不符，实际=$VER"; exit 1; }
          test "$BLD" = "24" || { echo "构建号不符，实际=$BLD"; exit 1; }

      - name: Assemble TIPA（免签 + ldid entitlements + RootHelper）
        run: |
          APP_SRC="build/DerivedData/Build/Products/Debug-iphoneos/Geranium.app"
          test -d "$APP_SRC"
          cp -R "$APP_SRC" build/Geranium.app
          codesign --remove build/Geranium.app || true
          rm -rf build/Geranium.app/_CodeSignature build/Geranium.app/embedded.mobileprovision
          # RootHelper 预编译二进制（取自官方 Son3ra1n/Andromeda v2.5.2 发布包，GPL-3.0；
          # 本项目改动全在 App 侧 Swift，helper 无改动原样复用）
          cp RootHelper/prebuilt/GeraniumRootHelper build/Geranium.app/GeraniumRootHelper
          ldid -Sentitlements.plist build/Geranium.app/Geranium
          ldid -S"Bookmark Location in Geranium/entitlements.plist" \
            "build/Geranium.app/PlugIns/Bookmark Location in Geranium.appex/Bookmark Location in Geranium"
          cd build
          rm -rf Payload
          mkdir Payload
          cp -R Geranium.app Payload/Geranium.app
          zip -qry Geranium.tipa Payload
          cd ..
          cp build/Geranium.tipa "Geranium-2.7.9-freetrack.tipa"
          shasum -a 256 "Geranium-2.7.9-freetrack.tipa" | tee sha256.txt
          ls -la "Geranium-2.7.9-freetrack.tipa"

      - name: Generate latest.json（云端更新检测元数据）
        run: |
          python3 - <<'PY'
          import io, json
          changelog = "\n".join([
              "1. 手画线路可以换画笔，绿笔固定、橙笔随机。",
              "2. 绿笔画的路一分不差，橙笔只在小范围浮动。",
              "3. 橙色那几段转成点后还能参与顺序打乱。",
              "4. 固定段和随机段能画在同一条线上，互不影响。",
              "5. 上次画的笔画继续保留，换笔也能接着改。",
              "6. 其他功能没变，已保存的线路还能接着用。",
          ])
          data = {
              "version": "2.7.9-freetrack",
              "build": 24,
              "title": "自由轨迹 v2.7.9（手画双画笔：固定 / 随机）",
              "changelog": changelog,
              "tipa_url": "https://github.com/liushQAQ/Andromeda/releases/download/v2.7.9-freetrack/Geranium-2.7.9-freetrack.tipa",
              "tipa_mirrors": [
                  "https://ghfast.top/https://github.com/liushQAQ/Andromeda/releases/download/v2.7.9-freetrack/Geranium-2.7.9-freetrack.tipa",
                  "https://gh-proxy.com/https://github.com/liushQAQ/Andromeda/releases/download/v2.7.9-freetrack/Geranium-2.7.9-freetrack.tipa",
              ],
              "min_ios": "15.0",
          }
          with io.open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(io.open("latest.json", encoding="utf-8").read())
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeTrack-TIPA
          path: |
            Geranium-2.7.9-freetrack.tipa
            latest.json
            sha256.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.9-freetrack
          name: "自由轨迹 2.7.9（手画双画笔：固定 / 随机）"
          body: |
            基于上游 Son3ra1n/Andromeda 2.5.2（GPL-3.0）。
            1. 手画时多了两种画笔：绿色固定、橙色随机。
            2. 绿笔画成什么样就走什么样，坐标不偏移。
            3. 橙笔只沿画线左右小幅摆动，不会跑到别处。
            4. 橙笔那几段转成点序列后，还能参与顺序打乱。
            5. 同一条线可以一段固定一段随机，分区生效。
            6. 其他功能没变，已保存的线路还能接着用。
            步数插件仍单独安装，不与本 App 打包在一起。
            RootHelper 使用官方 2.5.2 发布包二进制（无改动）。
          files: |
            Geranium-2.7.9-freetrack.tipa
            latest.json
            sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
